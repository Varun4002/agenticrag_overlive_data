[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-over-live-data"
version = "0.1.0"
description = "Agentic RAG over live work data (Jira/Notion/Gmail) — M0 skeleton"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "psycopg>=3.1",
    "pgvector>=0.3",
    "httpx>=0.27",
    # PII scrubbing (M3). The spaCy model itself is not a pip dependency:
    # install it once with `python -m spacy download en_core_web_md`.
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "spacy>=3.8",
    # Hot answer cache (M4): repeat questions from the same user skip the
    # pipeline. Optional at runtime — REDIS_URL unset disables it.
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["config"]

[tool.setuptools.package-data]
# Single-file operator dashboard served at /ui (no build step).
api = ["static/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"] # FastAPI Depends() in defaults is the documented pattern

[tool.ruff.lint.isort]
known-first-party = ["api", "connectors", "db", "evals", "evidence", "guardrails", "indexing", "llm", "memory", "orchestrator", "pii", "retrieval", "synthesis", "config"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Presidio and spaCy ship no type stubs; our wrappers are typed, the libs are not.
module = ["presidio_analyzer.*", "presidio_anonymizer.*", "spacy.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Alembic's runtime context object and migration scripts are dynamically typed
# by design; strict checking there buys nothing and cannot be satisfied.
module = ["db.migrations.*"]
disallow_untyped_calls = false
disallow_untyped_defs = false
